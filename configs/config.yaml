# Crop Disease Intelligence Platform Configuration
project_name: "Crop Disease Intelligence"
version: "2.0.0"

seed: 42

paths:
  dataset_root: "data/new_plant_diseases_dataset"
  train_split: "train"
  val_split: "valid"
  test_split: "test"
  models_dir: "models"
  results_dir: "results"
  metrics_dir: "results/metrics"
  figures_dir: "results/figures"
  reports_dir: "results/reports"
  class_names_path: "results/class_names.json"
  best_model_path: "models/best_model.keras"

dataset:
  num_classes: 38
  image_size: [224, 224]
  batch_size: 32
  channels: 3
  supported_extensions: [".jpg", ".jpeg", ".png", ".JPG", ".JPEG", ".PNG"]
  validation_split_ratio: 0.15
  test_split_ratio: 0.15

feature_extraction:
  color_histogram:
    enabled: true
    bins: [8, 8, 8]
    color_space: "HSV"
  hog:
    enabled: true
    orientations: 9
    pixels_per_cell: [16, 16]
    cells_per_block: [2, 2]
  glcm:
    enabled: true
    distances: [1, 3]
    angles: [0, 45, 90, 135]

classical_models:
  svm:
    kernel: "rbf"
    C: 10.0
    gamma: "scale"
    probability: true
  random_forest:
    n_estimators: 150
    max_depth: 25
    min_samples_split: 4
    n_jobs: -1
  xgboost:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: "hist"
    eval_metric: "mlogloss"

deep_learning_models:
  architectures:
    - "EfficientNetB0"
    - "MobileNetV2"
    - "ResNet50"
  stage1:
    epochs: 5
    learning_rate: 0.001
    optimizer: "adam"
    freeze_backbone: true
  stage2:
    epochs: 10
    learning_rate: 0.00005
    optimizer: "adam"
    unfreeze_layers: 20
    early_stopping:
      patience: 3
      monitor: "val_loss"
      min_delta: 0.001

inference:
  confidence_threshold_high: 0.85
  confidence_threshold_medium: 0.60
  uncertainty_warning_threshold: 0.60
  top_k: 3

explainability:
  gradcam:
    alpha: 0.35
    colormap: "jet"
